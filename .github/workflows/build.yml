name: build rules

# 只要 domains.txt（或构建脚本 / 内核版本 / Gitee 说明）有改动被推上来（网页上直接编辑提交也算），
# 就自动重新生成 clash.yaml、singbox.json、pt-domains.list 和 pt-domains.mrs，
# 把结果提交回本仓库，并把这四个规则文件 + gitee/README.md 同步到 Gitee 镜像仓库。
on:
  push:
    branches: [main]
    paths:
      - 'domains.txt'
      - 'tools/build.ps1'
      - 'tools/get-mihomo.ps1'
      - 'tools/mihomo.version'
      - '.github/workflows/build.yml'
      - 'gitee/README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 tools/mihomo.version 里锁定的那个版本，保证云端与本地产出的 .mrs 完全一致
      - name: Fetch mihomo kernel
        run: pwsh -NoProfile -File ./tools/get-mihomo.ps1

      - name: Regenerate rule files
        run: pwsh -NoProfile -File ./tools/build.ps1 -RequireMrs

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to update."
            exit 0
          fi
          echo "Changed files:"
          git status --porcelain
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate rule files [skip ci]"
          git push

      # 镜像到 Gitee：只推四个规则文件 + Gitee 版说明，构造独立提交后强推。
      # 先用 fetch 比对远端内容，一致时不产生多余提交。
      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 GITEE_TOKEN，无法同步到 Gitee"
            exit 1
          fi

          WORK="$(mktemp -d)"
          # Gitee 侧统一改用 pt-domain.* 命名，并剥掉注释行：
          #   - 文件名里含 clash 会被敏感词库拦截（它连文件名一起扫）
          #   - 「说明性注释 + 大批域名」的组合也会被判违规
          # 剥注释不影响规则语义，payload 与 clash.yaml 完全一致。
          grep -v '^#' clash.yaml > "$WORK/pt-domain.yaml"
          cp pt-domains.list "$WORK/pt-domain.list"
          cp pt-domains.mrs  "$WORK/pt-domain.mrs"
          cp singbox.json    "$WORK/pt-domain.json"
          cp gitee/README.md "$WORK/README.md"

          cd "$WORK"
          git init -q -b main
          git config user.name  "pt-domains sync bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "sync: rule files from upstream"

          REMOTE="https://xu-ruzhen:${GITEE_TOKEN}@gitee.com/xu-ruzhen/pt-domains.git"

          if git fetch -q --depth=1 "$REMOTE" main 2>/dev/null; then
            if git diff --quiet FETCH_HEAD HEAD; then
              echo "Gitee 已是同一份内容，跳过推送。"
              exit 0
            fi
          fi

          git push -q --force "$REMOTE" main
          echo "已同步 $WORK 的内容到 Gitee。"
