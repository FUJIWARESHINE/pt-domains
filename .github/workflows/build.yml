name: build rules

# 只要 domains.txt（或构建脚本 / 内核版本）有改动被推上来（网页上直接编辑提交也算），
# 就自动重新生成 clash.yaml、singbox.json、pt-domains.list 和 pt-domains.mrs，
# 并把结果提交回仓库。因此本地无需运行任何命令。
on:
  push:
    branches: [main]
    paths:
      - 'domains.txt'
      - 'tools/build.ps1'
      - 'tools/get-mihomo.ps1'
      - 'tools/mihomo.version'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 tools/mihomo.version 里锁定的那个版本，保证云端与本地产出的 .mrs 完全一致
      - name: Fetch mihomo kernel
        run: pwsh -NoProfile -File ./tools/get-mihomo.ps1

      - name: Regenerate rule files
        run: pwsh -NoProfile -File ./tools/build.ps1 -RequireMrs

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to update."
            exit 0
          fi
          echo "Changed files:"
          git status --porcelain
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate rule files [skip ci]"
          git push
